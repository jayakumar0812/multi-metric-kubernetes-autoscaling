# 13. TEST QUERIES CONFIGMAP
apiVersion: v1
kind: ConfigMap
metadata:
  name: test-queries
data:
  simple-query.graphql: |
    query SimpleUserQuery {
      user(id: "1") {
        name
        email
      }
    }
  medium-query.graphql: |
    query MediumComplexityQuery {
      users(first: 10) {
        name
        email
        posts(first: 5) {
          title
          content
        }
      }
    }
  complex-query.graphql: |
    query ComplexAnalyticsQuery {
      systemAnalytics {
        totalUsers
        totalPosts
        topUsers(limit: 20) {
          name
          email
          posts(first: 10) {
            title
            comments(first: 10) {
              content
              author {
                name
              }
            }
          }
        }
      }
    }