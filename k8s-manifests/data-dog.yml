# 1. DATADOG SECRET (API KEY)
apiVersion: v1
kind: Secret
metadata:
  name: datadog-secret
  namespace: default
type: Opaque
data:
  api-key: NDhiZWY3YmY5NDMxYjNlYWFhZjY1MjMyMzUxZTNkYTQ=   # Replace with your actual key

---
# 2. DATADOG AGENT DAEMONSET - FIXED: Removed system-probe annotation + Added hostPID
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: datadog-agent
  namespace: default
  labels:
    app: datadog-agent
spec:
  selector:
    matchLabels:
      app: datadog-agent
  template:
    metadata:
      labels:
        app: datadog-agent
      annotations: {}
    spec:
      serviceAccountName: datadog-agent
      hostNetwork: true
      hostPID: true           # ADDED: Fix for cgroup namespace warning
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: datadog-agent
        image: gcr.io/datadoghq/agent:7
        imagePullPolicy: Always
        ports:
          - containerPort: 8125  # DogStatsD
            name: dogstatsdport
            protocol: UDP
          - containerPort: 8126  # APM
            name: traceport
            protocol: TCP
        env:
          # Core configuration
          - name: DD_API_KEY
            valueFrom:
              secretKeyRef:
                name: datadog-secret
                key: api-key
          - name: DD_SITE
            value: "us5.datadoghq.com"
          - name: DD_KUBERNETES_KUBELET_HOST
            valueFrom:
              fieldRef:
                fieldPath: status.hostIP
          - name: DD_CLUSTER_NAME
            value: "graphql-hpa-research"
          
          # Tagging
          - name: DD_TAGS
            value: "env:research project:graphql-hpa component:auto-scaling"
          
          # Features
          - name: DD_APM_ENABLED
            value: "true"
          - name: DD_LOGS_ENABLED
            value: "true"
          - name: DD_DOGSTATSD_NON_LOCAL_TRAFFIC
            value: "true"
          - name: DD_PROCESS_AGENT_ENABLED
            value: "false"  # Disabled to reduce complexity
          - name: DD_SYSTEM_PROBE_ENABLED
            value: "false"   # Disabled to avoid connection issues
          
          # FIXED: Process config deprecation warnings
          - name: DD_PROCESS_CONFIG_CONTAINER_COLLECTION_ENABLED
            value: "true"
          - name: DD_PROCESS_CONFIG_PROCESS_COLLECTION_ENABLED
            value: "false"
          
          # Logging
          - name: DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL
            value: "true"
          - name: DD_LOG_LEVEL
            value: "INFO"
            
        volumeMounts:
          - name: dockersocket
            mountPath: /var/run/docker.sock
          - name: procdir
            mountPath: /host/proc
            readOnly: true
          - name: cgroups
            mountPath: /host/sys/fs/cgroup
            readOnly: true
          
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
      
      volumes:
        - hostPath:
            path: /var/run/docker.sock
          name: dockersocket
        - hostPath:
            path: /proc
          name: procdir
        - hostPath:
            path: /sys/fs/cgroup
          name: cgroups

---
# 3. DATADOG RBAC - FIXED: Complete proper YAML structure
apiVersion: v1
kind: ServiceAccount
metadata:
  name: datadog-agent
  namespace: default

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: datadog-agent
rules:
# Core resources - expanded permissions
- apiGroups: [""]
  resources: 
    - "nodes"
    - "nodes/metrics" 
    - "nodes/spec"
    - "nodes/proxy"           # ADDED: Fix for proxy access
    - "nodes/stats"           # ADDED: For node statistics
    - "pods"
    - "pods/status"           # ADDED: For pod status
    - "services"
    - "events"
    - "endpoints"             # ADDED: For service discovery
    - "configmaps"            # ADDED: For configuration access
    - "secrets"               # ADDED: For secret access (if needed)
  verbs: ["get", "list", "watch"]

# App resources
- apiGroups: ["apps"]
  resources: 
    - "deployments"
    - "replicasets" 
    - "daemonsets"
    - "statefulsets"
  verbs: ["get", "list", "watch"]

# HPA resources
- apiGroups: ["autoscaling"]
  resources: ["horizontalpodautoscalers"]
  verbs: ["get", "list", "watch"]

# Metrics resources
- apiGroups: ["metrics.k8s.io"]
  resources: ["nodes", "pods"]
  verbs: ["get", "list"]

# Custom metrics
- apiGroups: ["custom.metrics.k8s.io"]
  resources: ["*"]
  verbs: ["get", "list"]

# External metrics  
- apiGroups: ["external.metrics.k8s.io"]
  resources: ["*"]
  verbs: ["get", "list"]

# Non-resource URLs
- nonResourceURLs: ["/metrics", "/healthz", "/stats/*"]
  verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: datadog-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: datadog-agent
subjects:
- kind: ServiceAccount
  name: datadog-agent
  namespace: default

---
# 4. GRAPHQL SERVER (WITH DATADOG INTEGRATION)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphql-server
  labels:
    app: graphql-server
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: graphql-server
  template:
    metadata:
      labels:
        app: graphql-server
        service: graphql-server
      annotations:
        # Prometheus scraping
        prometheus.io/scrape: "true"
        prometheus.io/port: "4001"
        prometheus.io/path: "/metrics"
        
        # Datadog annotations
        ad.datadoghq.com/graphql-server.logs: '[{"source": "graphql", "service": "graphql-server"}]'
        ad.datadoghq.com/graphql-server.check_names: '["prometheus"]'
        ad.datadoghq.com/graphql-server.init_configs: '[{}]'
        ad.datadoghq.com/graphql-server.instances: |
          [{
            "prometheus_url": "http://%%host%%:4001/metrics",
            "namespace": "graphql",
            "metrics": ["*"],
            "tags": ["env:research", "project:graphql-hpa"]
          }]
    spec:
      containers:
      - name: graphql-server
        image: lucifer08/auto-scaler:v1
        imagePullPolicy: Always
        ports:
        - containerPort: 4000
          name: graphql
          protocol: TCP
        - containerPort: 4001
          name: rest-api
          protocol: TCP
        
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        
        env:
        # Application config
        - name: NODE_ENV
          value: "production"
        - name: GRAPHQL_PORT
          value: "4000"
        - name: REST_PORT
          value: "4001"
        - name: REDIS_URL
          value: "redis-service:6379"
        
        # Datadog APM config
        - name: DD_AGENT_HOST
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: DD_ENV
          value: "research"
        - name: DD_SERVICE
          value: "graphql-server"
        - name: DD_VERSION
          value: "v1"
        - name: DD_TRACE_ENABLED
          value: "true"
        - name: DD_LOGS_INJECTION
          value: "true"
        - name: DD_PROFILING_ENABLED
          value: "true"

---
# 5. HYBRID METRICS SERVER (WITH DATADOG)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hybrid-metrics-server
  labels:
    app: hybrid-metrics-server
    component: metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hybrid-metrics-server
  template:
    metadata:
      labels:
        app: hybrid-metrics-server
        service: hybrid-metrics
      annotations:
        ad.datadoghq.com/hybrid-metrics.logs: '[{"source": "metrics", "service": "hybrid-metrics"}]'
        ad.datadoghq.com/hybrid-metrics.check_names: '["prometheus"]'
        ad.datadoghq.com/hybrid-metrics.init_configs: '[{}]'
        ad.datadoghq.com/hybrid-metrics.instances: |
          [{
            "prometheus_url": "http://%%host%%:8080/metrics", 
            "namespace": "hybrid_metrics",
            "metrics": ["*"],
            "tags": ["env:research", "project:graphql-hpa"]
          }]
    spec:
      containers:
      - name: hybrid-metrics
        image: lucifer08/auto-scaler:hy-redis-v1.0
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: metrics
          protocol: TCP
        - containerPort: 3001
          name: http-api
          protocol: TCP
        
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        
        env:
        # Application config
        - name: GRAPHQL_URL
          value: "http://graphql-server:4000"
        - name: GRAPHQL_STATS_URL
          value: "http://graphql-server:4001"
        - name: PORT
          value: "3001"
        - name: LOG_LEVEL
          value: "info"
        - name: REDIS_URL
          value: "redis-service:6379"
        
        # Datadog config
        - name: DD_AGENT_HOST
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: DD_ENV
          value: "research"
        - name: DD_SERVICE
          value: "hybrid-metrics"
        - name: DD_VERSION
          value: "v1.0"
        - name: DD_TRACE_ENABLED
          value: "true"

---
# 6. CUSTOM METRICS API (WITH DATADOG)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: custom-metrics-api
  labels:
    app: custom-metrics-api
    component: metrics-bridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: custom-metrics-api
  template:
    metadata:
      labels:
        app: custom-metrics-api
        service: custom-metrics
      annotations:
        ad.datadoghq.com/custom-metrics.logs: '[{"source": "metrics", "service": "custom-metrics"}]'
    spec:
      serviceAccountName: custom-metrics-apiserver
      containers:
      - name: custom-metrics-api
        image: lucifer08/auto-scaler:custom-api-v1.0
        imagePullPolicy: Always
        ports:
        - containerPort: 8443
          name: https
          protocol: TCP
        
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8443
            scheme: HTTPS
          initialDelaySeconds: 30
          periodSeconds: 30
        
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8443
            scheme: HTTPS
          initialDelaySeconds: 15
          periodSeconds: 15
        
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        
        env:
        # Application config
        - name: HYBRID_METRICS_URL
          value: "http://hybrid-metrics-server:3001"
        - name: GRAPHQL_STATS_URL
          value: "http://graphql-server:4001"
        - name: PORT
          value: "8443"
        - name: TLS_CERT_FILE
          value: "/etc/certs/tls.crt"
        - name: TLS_KEY_FILE
          value: "/etc/certs/tls.key"
        - name: LOG_LEVEL
          value: "info"
        - name: REDIS_URL
          value: "redis-service:6379"
        
        # Datadog config
        - name: DD_AGENT_HOST
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: DD_ENV
          value: "research"
        - name: DD_SERVICE
          value: "custom-metrics-api"
        - name: DD_VERSION
          value: "v1.0"
        - name: DD_TRACE_ENABLED
          value: "true"
        
        volumeMounts:
        - name: tls-certs
          mountPath: /etc/certs
          readOnly: true
      
      volumes:
      - name: tls-certs
        secret:
          secretName: custom-metrics-api-tls

---
# 7. REDIS WITH DATADOG MONITORING
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        service: redis
      annotations:
        ad.datadoghq.com/redis.check_names: '["redisdb"]'
        ad.datadoghq.com/redis.init_configs: '[{}]'
        ad.datadoghq.com/redis.instances: |
          [{
            "host": "%%host%%",
            "port": 6379,
            "tags": ["env:research", "project:graphql-hpa"]
          }]
        ad.datadoghq.com/redis.logs: '[{"source": "redis", "service": "redis"}]'
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        command: ["redis-server"]
        args: ["--maxmemory", "100mb", "--maxmemory-policy", "allkeys-lru"]

